[package]
name = "pharmacare-desktop"
version = "0.1.0"
edition = "2021"
description = "PharmaCare Pro desktop POS"
authors = ["Sourav Shaw"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = { version = "0.4", features = ["clock"] }
keyring = "3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"  # AES-256-GCM at-rest crypto (S26.E silent killer #5, ADR-0071)
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
opener = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false }  # rc pin — bump to stable when ort 2.0 ships (TODO S25, ADR-0069)

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol", "cygnet-live", "cleartax-live"]
custom-protocol = ["tauri/custom-protocol"]
# When enabled, the Cygnet GSP adapter performs real HTTP calls. Default
# off — keeps reqwest/native-tls out of the main binary surface until the
# vendor contract closes. Build via: cargo build --features cygnet-live
cygnet-live = []
cleartax-live = []
tier-b-onnx = ["dep:ort"]

# --- Perf harness (ADR 0067) ---------------------------------------------
# criterion drives the cold_start + bill_save benches under benches/.
# Kept in [dev-dependencies] so it never reaches the shipped binary.
[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "bill_save"
harness = false
