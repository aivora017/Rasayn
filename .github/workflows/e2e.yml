# Pre-pilot E2E smoke (Playwright, browser-mode).
# S28-A2 — runs the 5 critical-flow specs against the vite dev server.
# Tauri-driver upgrade is post-pilot (see apps/desktop/e2e/README.md).
#
# Kept as a SEPARATE workflow so a Playwright failure does not block the
# typescript / cargo / migration jobs in ci.yml.
name: e2e

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright (chromium, browser-mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Topo-build workspace deps so vite can resolve them at dev-server start.
      - run: npx turbo run build --filter=@pharmacare/desktop
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: npm run test:e2e -- --reporter=line
        working-directory: apps/desktop
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7
